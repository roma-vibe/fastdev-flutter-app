schema = 1
id = "flutter-app"
name = "Flutter App"
description = "A Flutter app for Android and iOS with a browser preview, a responsive Liquid Glass design or Material 3, and a choice of Flutter widgets or Tailwind-style native utilities. Riverpod, go_router, local notes, appearance settings and a strict quality gate give AI agents a small, explicit starting architecture."
category = "mobile"
languages = ["dart"]
tags = ["flutter", "mobile", "android", "ios", "web", "riverpod", "material", "liquid-glass", "utility-first", "agent-ready"]
stack = ["Flutter 3.47.6 stable", "Dart 3.13.5", "Riverpod 3.4", "go_router 18", "Liquid Glass or Material 3", "Flutter widgets or Mix / Tailwind utilities", "shared_preferences 2.5 (demo storage)", "flutter_test + flutter_lints 6"]

[requirements]
flutter = ">=3.47.6, <4"
dart = ">=3.13.5, <4"

[env]
APP_NAME = "{{ project.name }}"
APP_SLUG = "{{ project.slug }}"
APP_IDENTIFIER = "com.example.fd{{ project.slug | replace('-', '.fd') }}"

[ports]
WEB_PORT = 8410

[[setup]]
label = "Install locked Flutter dependencies"
run = "flutter pub get --enforce-lockfile"

[[setup]]
label = "Configure application names and identifiers"
run = "dart run tool/project.dart configure"

[commands.dev]
label = "Dev"
description = "Run the browser preview. Restart this command after edits when using fastDev without a terminal."
run = "dart run tool/project.dart dev"
long = true
primary = true
url = "http://127.0.0.1:${WEB_PORT}"

[commands.build]
label = "Build"
description = "Build the release web app into build/web."
run = "dart run tool/project.dart build"

[commands.start]
label = "Start"
description = "Serve the existing release web build on the allocated port."
run = "dart run tool/project.dart start"
long = true
url = "http://127.0.0.1:${WEB_PORT}"

[commands.test]
label = "Test"
run = "dart run tool/project.dart test"

[commands.check]
label = "Check"
description = "Check formatting, strict analysis and all unit/widget tests."
run = "dart run tool/project.dart check"

[commands.format]
label = "Format"
run = "dart run tool/project.dart format"

[commands.devices]
label = "List devices"
run = "flutter devices"

[commands.run-device]
label = "Run on device"
description = "Run on an emulator, simulator or connected device. Its platform SDK must be installed."
run = 'dart run tool/project.dart run -d "$DEVICE_ID"'
long = true
inputs = [{ name = "DEVICE_ID", label = "Device ID", placeholder = "ID from List devices" }]

[commands.build-android]
label = "Android APK"
description = "Build a local release APK. Requires the Android SDK and JDK; configure release signing before store distribution."
run = "dart run tool/project.dart build-android"

[commands.build-ios]
label = "iOS build (unsigned)"
description = "Build an unsigned iOS release. Requires full Xcode and its iOS platform tools."
run = "dart run tool/project.dart build-ios"

[choices.ui]
label = "Design"
description = "The visual design. Both options share the same app, routing and state."
default = "glass"

[choices.ui.options.glass]
label = "Liquid Glass"
description = "Translucent panels, clipped blur, soft wallpaper and adaptive navigation inspired by macOS."

[choices.ui.options.material]
label = "Material 3"
description = "Opaque Material surfaces using the same responsive layout and accessible controls."

[choices.styling]
label = "Styles"
description = "How shared panels are styled. Flutter renders native widgets rather than HTML or CSS."
default = "flutter"

[choices.styling.options.flutter]
label = "Flutter widgets"
description = "Standard Flutter decoration and theme tokens, with no extra styling dependency. Recommended."

[choices.styling.options.tailwind]
label = "Mix / Tailwind utilities (experimental)"
description = "Native Tailwind-like class strings via Mix 2.2 and mix_winds alpha. A subset of Tailwind, not browser CSS; its API is experimental."

[verify]
commands = ["check", "build"]
variants = [
  { ui = "glass", styling = "tailwind" },
  { ui = "material", styling = "flutter" },
  { ui = "material", styling = "tailwind" },
]

[preview]
command = "dev"
url = "http://127.0.0.1:${WEB_PORT}"
message = "Open the link, add and delete a note, refresh to check persistence, then change Appearance in Settings. This browser preview shares the mobile app's Dart code. Stop the preview when finished."

